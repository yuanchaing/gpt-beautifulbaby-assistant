<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>正在開啟頁面…</title>
  <style>
    html,body{margin:0;padding:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","Helvetica Neue",Arial}
    .wrap{max-width:860px;margin:0 auto;padding:24px}
    .muted{color:#666;font-size:14px}
    .err{color:#b91c1c}
    .ok{color:#065f46}
    .spinner{display:inline-block;width:1em;height:1em;border:.15em solid #ddd;border-top-color:#111;border-radius:50%;animation:spin .9s linear infinite;vertical-align:-.2em}
    @keyframes spin{to{transform:rotate(360deg)}}
    #panel{display:none}
    pre{background:#0f172a;color:#cbd5e1;border-radius:8px;padding:12px;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap}
    button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;font-size:16px}
    code{background:#f1f5f9;padding:.1em .35em;border-radius:.35em}
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div class="wrap">
    <h2 id="title">正在開啟頁面… <span class="spinner"></span></h2>
    <p id="tip" class="muted">若未能成功開啟，請確認 LIFF 允許的網域與參數格式。</p>

    <!-- 只有 ?debug=1 時會顯示 -->
    <div id="panel">
      <p class="ok">已取得目標網址，即將導向：</p>
      <pre id="finalUrlBox"></pre>
      <p class="muted" id="uidHint"></p>
      <button id="goBtn">立即前往</button>
    </div>
  </div>

  <script>
    /*** 你可以把 LIFF_ID 直接寫死在這裡，或用 ?liffId= 由 URL 傳入 ***/
    const DEFAULT_LIFF_ID = "2008287433-pJxD7oz9"; // ← 改成你的 LIFF ID（建議）
    /*************************************************************************/

    function getParam(name){ return new URLSearchParams(location.search).get(name); }
    function multiDecode(s, times=3){ if(!s) return s; let o=String(s); for(let i=0;i<times;i++){ try{ const d=decodeURIComponent(o); if(d===o) break; o=d; }catch{ break; } } return o; }
    function parseQS(qsLike){ if(!qsLike) return new URLSearchParams(''); let qs=String(qsLike).trim(); if(qs.startsWith('?')||qs.startsWith('#')) qs=qs.slice(1); return new URLSearchParams(qs); }
    function safeHttpUrl(u){ try{ const url=new URL(u); return /^(http|https):$/i.test(url.protocol); }catch{ return false; } }

    function findToParam(){
      const usp = new URLSearchParams(location.search);
      let to = usp.get('to');

      // liff.state 內含 to（多層編碼/巢狀）
      if(!to){
        const ls = usp.get('liff.state');
        if(ls){
          const s1 = multiDecode(ls);
          const p1 = parseQS(s1);
          to = p1.get('to');
          if(!to){
            const ls2 = p1.get('liff.state');
            if(ls2){
              to = parseQS(multiDecode(ls2)).get('to');
            }
          }
        }
      }
      if(!to && location.hash){ to = parseQS(location.hash).get('to'); }
      if(to) to = multiDecode(to);
      return to || null;
    }

    async function ensureLiffReadyAndLogin(liffId){
      await liff.init({ liffId });
      if(!liff.isLoggedIn()){
        // 讓 LIFF 完成登入，回跳本頁後再繼續
        liff.login({ redirectUri: location.href });
        return new Promise(()=>{}); // login 會跳轉，這裡不再繼續
      }
      await liff.ready;
    }

    async function getUserIdSafe(){
      try{
        // 1) 先用 context（在 LINE app 內通常可取到）
        const ctx = liff.getContext?.();
        if(ctx?.userId) return ctx.userId;
        // 2) 取不到就用 profile（需已登入）
        const prof = await liff.getProfile();
        if(prof?.userId) return prof.userId;
      }catch{}
      return null;
    }

    (async () => {
      const titleEl = document.getElementById('title');
      const tipEl = document.getElementById('tip');
      const showDebug = (getParam('debug') === '1');

      const toRaw = findToParam();
      if(!toRaw){
        titleEl.innerHTML = '開啟失敗';
        tipEl.innerHTML = '未帶到 <code>to</code> 參數，請確認 URL 是否正確。';
        return;
      }
      if(!safeHttpUrl(toRaw)){
        titleEl.innerHTML = '開啟失敗';
        tipEl.innerHTML = 'to 參數不是有效的 http(s) URL：<br><code>' + toRaw + '</code>';
        return;
      }

      // 1) 初始化 LIFF 並（必要時）自動登入
      const liffId = getParam('liffId') || DEFAULT_LIFF_ID;
      try{
        await ensureLiffReadyAndLogin(liffId);
      }catch(e){
        // 若真的無法初始化，仍然嘗試直接外開（但無法帶 userId）
        const fallback = new URL(toRaw).href;
        liff.openWindow({ url: fallback, external: true });
        return;
      }

      // 2) 取得 userId（context 優先，profile 備援）
      const uid = await getUserIdSafe();

      // 3) 把 userId 注入到目標網址（若本來沒有）
      const urlObj = new URL(toRaw);
      if(uid && !urlObj.searchParams.has('userid')){
        urlObj.searchParams.set('userid', uid);
      }
      const finalUrl = urlObj.href;

      // 4) 外開瀏覽器
      if(showDebug){
        // 手機驗證模式：先顯示最終網址（含 userid），2 秒後自動外開
        document.getElementById('panel').style.display='block';
        document.getElementById('finalUrlBox').textContent = finalUrl;
        document.getElementById('uidHint').textContent = uid
          ? `已注入 userid=${uid}`
          : '未能從 LIFF 取得 userId（可能非 1:1 chat 或權限受限），將直接外開。';
        let jumped=false;
        const go=()=>{ if(!jumped){ jumped=true; liff.openWindow({ url: finalUrl, external: true }); }};
        document.getElementById('goBtn').addEventListener('click', go);
        setTimeout(go, 2000);
        titleEl.textContent = '預覽即將開啟的頁面';
        return;
      }

      liff.openWindow({ url: finalUrl, external: true });
    })();
  </script>
</body>
</html>
