<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFF Relay</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 20px; text-align: center; }
  #msg { color: #444; white-space: pre-wrap; text-align:left; display:inline-block; }
</style>
</head>
<body>
<div id="msg">載入中…</div>
<script>
(async () => {
  const out = (t) => (document.getElementById('msg').textContent = t);

  // 解析一段查詢字串 (可以是 "?a=1" 或 "a=1")
  const parseQS = (qs) => new URLSearchParams(qs.startsWith('?') ? qs.slice(1) : qs);

  // 從一段 URL-like（例如 "/liff-relay.html?to=..."）抽出 query params
  const parseURLLikeParams = (s) => {
    try {
      let raw = s;
      try { raw = decodeURIComponent(s); } catch {}
      const u = new URL(raw.startsWith('http') ? raw : (location.origin + (raw.startsWith('/') ? raw : '/' + raw)));
      return u.searchParams;
    } catch { return new URLSearchParams(''); }
  };

  // 從多來源抽取 to / venuesid / openExternalBrowser
  const extractFromParams = (params) => {
    let to = params.get('to');
    let venuesid = params.get('venuesid');
    let oeb = params.get('openExternalBrowser');

    // 若沒 to，嘗試從 liff.state / state 內層解析
    if (!to) {
      const ls = params.get('liff.state') || params.get('state');
      if (ls) {
        const inner = parseURLLikeParams(ls);
        to = inner.get('to') || to;
        venuesid = venuesid || inner.get('venuesid');
        oeb = oeb || inner.get('openExternalBrowser');
      }
    }
    return { to, venuesid, oeb };
  };

  // 先讀目前網址 (初步，可能抓不到)
  const locQS = parseQS(location.search);
  let { to, venuesid, oeb } = extractFromParams(locQS);
  const hashQS = parseQS((location.hash || '').replace(/^#/, ''));
  if (!to) {
    const fromHash = extractFromParams(hashQS);
    to = fromHash.to || to;
    venuesid = venuesid || fromHash.venuesid;
    oeb = oeb || fromHash.oeb;
  }
  if (!to) {
    // 先記錄等待 liff.init() 後用 context 再補
    out('尋找目標網址中…（to 參數尚未在初始網址內，將於 LIFF 初始化後再嘗試）');
  } else {
    sessionStorage.setItem('relay_to', to);
  }

  // 取得 LIFF ID
  let liffId = '';
  try {
    const r = await fetch('/api/liff').then(r => r.json()).catch(() => ({}));
    liffId = r?.liffId || '';
  } catch {}
  if (!liffId) { out('LIFF 未設定（/api/liff 無回傳 liffId）'); return; }

  // 載入 LIFF SDK
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
  });

  // 初始化 LIFF
  try { await liff.init({ liffId }); }
  catch (e) { out('LIFF 初始化失敗：' + (e?.message || e)); return; }

  // 必要時登入
  if (!liff.isLoggedIn()) {
    out('登入中…');
    liff.login({ redirectUri: location.href });
    return;
  }

  // ★ 重點：優先從 LIFF context 取 queryString（很多裝置把 liff.state 放這裡）
  try {
    const ctx = liff.getContext?.();
    const qStr = ctx?.queryString || '';
    if (qStr) {
      const ctxQS = parseQS(qStr);
      const fromCtx = extractFromParams(ctxQS);
      if (!to && fromCtx.to) to = fromCtx.to;
      if (!venuesid && fromCtx.venuesid) venuesid = fromCtx.venuesid;
      if (!oeb && fromCtx.oeb) oeb = fromCtx.oeb;
    }
  } catch {}

  // 最後備援：sessionStorage
  if (!to) to = sessionStorage.getItem('relay_to');

  if (!to) {
    // 仍找不到，輸出偵錯資訊
    let ctxQSStr = '';
    try { ctxQSStr = (liff.getContext?.().queryString || '(無)'); } catch {}
    out([
      '[錯誤] 缺少 to 參數',
      'location.search = ' + location.search,
      'location.hash   = ' + location.hash,
      'session.relay_to= ' + (sessionStorage.getItem('relay_to') || '(無)'),
      'liff context qs = ' + ctxQSStr
    ].join('\n'));
    return;
  }

  sessionStorage.setItem('relay_to', to);

  // 取得 userId（可選）
  let userId = '';
  try {
    const profile = await liff.getProfile();
    userId = profile?.userId || '';
  } catch {}

  // 組成最終 URL
  const target = new URL(decodeURIComponent(to));
  const tQS = target.searchParams;
  if (userId) tQS.set('userId', userId);
  if (venuesid) tQS.set('venuesid', venuesid);

  const finalUrl = target.toString();
  const openExternal =
    oeb || locQS.get('openExternalBrowser') ||
    (locQS.get('liff.state') && parseURLLikeParams(locQS.get('liff.state')).get('openExternalBrowser')) || null;

  // 跳轉
  if (openExternal === '1' && liff.isInClient()) {
    out('即將於外部瀏覽器開啟…');
    liff.openWindow({ url: finalUrl, external: true });
  } else {
    out('跳轉中…');
    location.replace(finalUrl);
  }
})();
</script>
</body>
</html>
