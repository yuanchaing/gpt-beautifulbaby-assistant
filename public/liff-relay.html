<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFF Relay</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 20px; text-align: center; }
  #msg { color: #444; }
</style>
</head>
<body>
<div id="msg">載入中…</div>
<script>
(async () => {
  const el = document.getElementById('msg');

  // 解析 URL 參數的小工具
  function getSearchParams(urlLike) {
    try {
      // 若是相對路徑（例如 /liff-relay.html?to=...），用目前 origin 補上
      const u = new URL(urlLike, location.origin);
      return u.searchParams;
    } catch {
      return new URLSearchParams('');
    }
  }

  const currentParams = new URLSearchParams(location.search);

  // 1) 先嘗試從目前網址直接取得 to
  let to = currentParams.get('to');

  // 2) 若沒有，嘗試從 liff.state 裡面還原（LIFF 深層連結會把 to 放在這裡）
  if (!to) {
    const liffState = currentParams.get('liff.state');
    if (liffState) {
      const stateParams = getSearchParams(liffState);
      to = stateParams.get('to') || null;

      // 把 liff.state 內的 openExternalBrowser / venuesid 也一併帶出來（若目前網址沒有）
      if (!currentParams.get('openExternalBrowser') && stateParams.get('openExternalBrowser')) {
        currentParams.set('openExternalBrowser', stateParams.get('openExternalBrowser'));
      }
      if (!currentParams.get('venuesid') && stateParams.get('venuesid')) {
        currentParams.set('venuesid', stateParams.get('venuesid'));
      }
    }
  }

  // 3) 若還是沒有，從 sessionStorage 還原（登入後跳轉常發生）
  if (!to && document.referrer.includes('liff.line.me')) {
    to = sessionStorage.getItem('relay_to');
  }
  if (!to) to = sessionStorage.getItem('relay_to');

  if (!to) {
    el.textContent = '缺少 to 參數';
    return;
  }
  // 把 to 暫存，讓授權跳轉回來時可還原
  sessionStorage.setItem('relay_to', to);

  // 4) 取得 LIFF ID
  let liffId = '';
  try {
    const r = await fetch('/api/liff');
    const j = await r.json();
    liffId = j.liffId || '';
  } catch {}
  if (!liffId) { el.textContent = 'LIFF 未設定（/api/liff 無回傳 liffId）'; return; }

  // 5) 載入 LIFF SDK
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });

  // 6) 初始化 LIFF
  try { await liff.init({ liffId }); }
  catch (e) { el.textContent = 'LIFF 初始化失敗：' + (e?.message || e); return; }

  // 7) 未登入就導去登入（redirect 回本頁）
  if (!liff.isLoggedIn()) {
    el.textContent = '登入中…';
    liff.login({ redirectUri: location.href });
    return;
  }

  // 8) 取得使用者 ID（可選）
  let userId = '';
  try {
    const profile = await liff.getProfile();
    userId = profile?.userId || '';
  } catch {}

  // 9) 組合最終導向網址（把 userId 與 venuesid 帶上）
  const target = new URL(decodeURIComponent(to));
  const qs = target.searchParams;
  if (userId) qs.set('userId', userId);

  // venuesid / openExternalBrowser 可能來自目前網址或 liff.state
  const venuesid = currentParams.get('venuesid');
  if (venuesid) qs.set('venuesid', venuesid);

  const finalUrl = target.toString();

  // 10) 是否改用外部瀏覽器開啟
  const oeb = currentParams.get('openExternalBrowser');
  if (oeb === '1' && liff.isInClient()) {
    el.textContent = '即將於外部瀏覽器開啟…';
    liff.openWindow({ url: finalUrl, external: true });
  } else {
    el.textContent = '跳轉中…';
    location.replace(finalUrl);
  }
})();
</script>
</body>
</html>
