<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>LIFF Relay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 千萬不要加 <base href="/liff-relay.html/">，會造成路徑重複 -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<script>
(async () => {
  // 解析查詢參數
  const params = new URLSearchParams(location.search);
  const to = params.get('to');
  const openExternal = params.get('openExternalBrowser') === '1';

  if (!to) {
    document.body.textContent = 'Missing "to" parameter';
    return;
  }

  //（可選）白名單保護，避免開到奇怪網域
  const ALLOW = ['arcompletions.onrender.com'];
  try {
    const u = new URL(to);
    if (!ALLOW.includes(u.hostname)) {
      document.body.textContent = 'Target domain not allowed';
      return;
    }
  } catch (e) {
    document.body.textContent = 'Invalid "to" URL';
    return;
  }

  // 初始化 LIFF
  try {
    await liff.init({ liffId: '2008287433-pJxD7oz9' });
  } catch (e) {
    // 即使 LIFF init 失敗，也保底用 replace 導出
    location.replace(to);
    return;
  }

  // 依需求是否外部開啟
  if (openExternal) {
    liff.openWindow({ url: to, external: true });
  } else {
    // 站內跳轉
    location.replace(to);
  }
})();
</script>
</body>
</html>
