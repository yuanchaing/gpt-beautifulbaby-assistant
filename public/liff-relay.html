<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFF Relay</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 20px; text-align: center; }
  #msg { color: #444; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="msg">載入中…</div>
<script>
(async () => {
  const el = document.getElementById('msg');

  // 小工具
  const parseParams = (s) => {
    try {
      // s 可能是 "/liff-relay.html?to=..." 或完整 URL 或已編碼字串
      let raw = s;
      try { raw = decodeURIComponent(s); } catch {}
      const u = new URL(raw.startsWith('http') ? raw : (location.origin + (raw.startsWith('/') ? raw : '/' + raw)));
      return u.searchParams;
    } catch {
      return new URLSearchParams('');
    }
  };
  const getQS = () => new URLSearchParams(location.search);
  const getHashQS = () => new URLSearchParams((location.hash || '').replace(/^#/, ''));

  // 1) 盡早嘗試還原 to（以免中途 login 跳轉丟失）
  const qsNow = getQS();
  const hashQS = getHashQS();

  let to =
    qsNow.get('to') ||                                   // 直接 ?to=
    (qsNow.get('liff.state') && parseParams(qsNow.get('liff.state')).get('to')) || // ?liff.state=...to=...
    (qsNow.get('state') && parseParams(qsNow.get('state')).get('to')) ||           // ?state=...to=...
    hashQS.get('to') ||                                   // #to=...
    sessionStorage.getItem('relay_to') ||                 // 上次留下的
    null;

  if (to) sessionStorage.setItem('relay_to', to);

  // 2) 沒有 to 就先顯示提示，但先別退出；等 init 後再從 liff context 補救一次
  if (!to) el.textContent = '尋找目標網址中…（to 參數未在初始網址內）';

  // 3) 取得 LIFF ID
  let liffId = '';
  try {
    const j = await fetch('/api/liff').then(r => r.json()).catch(() => ({}));
    liffId = j?.liffId || '';
  } catch {}
  if (!liffId) { el.textContent = 'LIFF 未設定（/api/liff 無回傳 liffId）'; return; }

  // 4) 載入 LIFF SDK
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });

  // 5) 初始化 LIFF
  try { await liff.init({ liffId }); }
  catch (e) { el.textContent = 'LIFF 初始化失敗：' + (e?.message || e); return; }

  // 6) 未登入就先登入（redirect 回本頁）
  if (!liff.isLoggedIn()) {
    el.textContent = '登入中…';
    liff.login({ redirectUri: location.href });
    return;
  }

  // 7) 若一開始沒有 to，嘗試從 LIFF Context 補救
  if (!to) {
    try {
      const ctx = liff.getContext?.();
      const qsStr = ctx?.queryString || ''; // e.g. "liff.state=%2Fliff-relay.html%3Fto%3D..."
      const ctxQS = new URLSearchParams(qsStr);
      to =
        ctxQS.get('to') ||
        (ctxQS.get('liff.state') && parseParams(ctxQS.get('liff.state')).get('to')) ||
        null;
      if (to) sessionStorage.setItem('relay_to', to);
    } catch {}
  }

  if (!to) {
    // 仍找不到，輸出偵錯資訊協助定位
    const debug = [
      '[錯誤] 缺少 to 參數',
      'location.search = ' + location.search,
      'location.hash   = ' + location.hash,
      'session.relay_to= ' + (sessionStorage.getItem('relay_to') || '(無)'),
      'liff.getContext()?.queryString = ' + (liff.getContext?.().queryString || '(無)')
    ].join('\n');
    el.textContent = debug;
    return;
  }

  // 8) 取得 userId
  let userId = '';
  try {
    const profile = await liff.getProfile();
    userId = profile?.userId || '';
  } catch {}

  // 9) 組合最終網址（帶上 userId / venuesid / openExternalBrowser）
  const target = new URL(decodeURIComponent(to));
  const targetQS = target.searchParams;
  if (userId) targetQS.set('userId', userId);

  // 可能存在於初始 URL 或 liff.state 內
  const venuesid = qsNow.get('venuesid') || (qsNow.get('liff.state') && parseParams(qsNow.get('liff.state')).get('venuesid')) || null;
  if (venuesid) targetQS.set('venuesid', venuesid);

  const finalUrl = target.toString();

  const oeb =
    qsNow.get('openExternalBrowser') ||
    (qsNow.get('liff.state') && parseParams(qsNow.get('liff.state')).get('openExternalBrowser')) ||
    null;

  // 10) 跳轉
  if (oeb === '1' && liff.isInClient()) {
    el.textContent = '即將於外部瀏覽器開啟…';
    liff.openWindow({ url: finalUrl, external: true });
  } else {
    el.textContent = '跳轉中…';
    location.replace(finalUrl);
  }
})();
</script>
</body>
</html>
