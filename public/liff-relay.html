<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>正在開啟頁面…</title>
  <style>
    html,body{margin:0;padding:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","Helvetica Neue",Arial}
    .wrap{max-width:860px;margin:0 auto;padding:24px}
    .muted{color:#666;font-size:14px}
    .err{color:#b91c1c}
    .ok{color:#065f46}
    .spinner{display:inline-block;width:1em;height:1em;border:.15em solid #ddd;border-top-color:#111;border-radius:50%;animation:spin .9s linear infinite;vertical-align:-.2em}
    @keyframes spin{to{transform:rotate(360deg)}}
    #panel{display:none}
    pre{background:#0f172a;color:#cbd5e1;border-radius:8px;padding:12px;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap}
    button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;font-size:16px}
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div class="wrap">
    <h2 id="title">正在開啟頁面… <span class="spinner"></span></h2>
    <p id="tip" class="muted">若未能成功開啟，請確認 LIFF 允許的網域與參數格式。</p>

    <!-- 只有 ?debug=1 時會顯示 -->
    <div id="panel">
      <p class="ok">已取得目標網址，即將導向：</p>
      <pre id="finalUrlBox"></pre>
      <p class="muted" id="uidHint"></p>
      <button id="goBtn">立即前往</button>
    </div>
  </div>

  <script>
    // 多層 URL 解碼（處理 %252F 這類）
    function multiDecode(s, times = 3) {
      if (!s) return s;
      let out = String(s);
      for (let i = 0; i < times; i++) {
        try {
          const dec = decodeURIComponent(out);
          if (dec === out) break;
          out = dec;
        } catch { break; }
      }
      return out;
    }
    function parseQS(qsLike) {
      if (!qsLike) return new URLSearchParams('');
      let qs = String(qsLike).trim();
      if (qs.startsWith('?') || qs.startsWith('#')) qs = qs.slice(1);
      return new URLSearchParams(qs);
    }
    function getParam(name){
      const usp = new URLSearchParams(location.search);
      return usp.get(name);
    }
    function findToParam() {
      const usp = new URLSearchParams(location.search);
      let to = usp.get('to');
      if (!to) {
        const ls = usp.get('liff.state');
        if (ls) {
          const s1 = multiDecode(ls);
          const p1 = parseQS(s1);
          to = p1.get('to');
          if (!to) {
            const ls2 = p1.get('liff.state');
            if (ls2) {
              const s2 = multiDecode(ls2);
              to = parseQS(s2).get('to');
            }
          }
        }
      }
      if (!to && location.hash) {
        to = parseQS(location.hash).get('to');
      }
      if (to) to = multiDecode(to);
      return to;
    }
    function safeHttpUrl(u) {
      try {
        const url = new URL(u);
        return /^(http|https):$/i.test(url.protocol);
      } catch { return false; }
    }

    (async () => {
      const titleEl = document.getElementById('title');
      const tipEl = document.getElementById('tip');
      const showDebug = (getParam('debug') === '1');

      const toRaw = findToParam();
      if (!toRaw) {
        titleEl.innerHTML = '開啟失敗';
        tipEl.innerHTML = '未帶到 <code>to</code> 參數，請確認 URL 是否正確。';
        return;
      }
      if (!safeHttpUrl(toRaw)) {
        titleEl.innerHTML = '開啟失敗';
        tipEl.innerHTML = 'to 參數不是有效的 http(s) URL：<br><code>' + toRaw + '</code>';
        return;
      }

      // 嘗試從 LIFF 取得 userId，若取不到就略過
      let finalUrl = toRaw;
      try {
        await liff.init({ liffId: "DUMMY" }).catch(()=>{});
        const ctx = liff.getContext ? liff.getContext() : null;
        const uid = ctx?.userId || null;

        const urlObj = new URL(finalUrl);
        if (uid && !urlObj.searchParams.has('userid')) {
          urlObj.searchParams.set('userid', uid);
        }
        finalUrl = urlObj.href;

        if (showDebug) {
          document.getElementById('uidHint').textContent = uid
            ? `已注入 userid=${uid}`
            : '未能從 LIFF 取得 userId（可能非 1:1 chat 或權限受限），已照原網址導向。';
        }
      } catch {
        // 失敗就照原網址導向
      }

      // debug 預覽模式：手機也能看見最終網址（含 userid）
      if (showDebug) {
        titleEl.textContent = '預覽即將開啟的頁面';
        document.getElementById('panel').style.display = 'block';
        document.getElementById('finalUrlBox').textContent = finalUrl;

        // 2 秒後自動前往，或點按鈕立即前往
        let jumped = false;
        const go = () => { if (!jumped) { jumped = true; location.replace(finalUrl); } };
        document.getElementById('goBtn').addEventListener('click', go);
        setTimeout(go, 2000);
        return;
      }

      // 一般模式：直接跳轉
      location.replace(finalUrl);
    })();
  </script>
</body>
</html>
