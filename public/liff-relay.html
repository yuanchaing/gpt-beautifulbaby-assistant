<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFF Relay</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 20px; text-align: center; }
  #msg { color: #444; }
</style>
</head>
<body>
<div id="msg">載入中…</div>
<script>
(async () => {
  const el = document.getElementById('msg');

  // ✅ 1. 嘗試從 URL query 或 sessionStorage 取回原始 to 參數
  const currentParams = new URLSearchParams(location.search);
  let to = currentParams.get('to') || sessionStorage.getItem('relay_to');

  // LINE LIFF 重新導回時會帶 liffClientId/code 等參數，會遺失 to
  if (!to && document.referrer.includes('liff.line.me')) {
    to = sessionStorage.getItem('relay_to');
  }

  // 沒有 to，直接提示
  if (!to) {
    el.textContent = '缺少 to 參數';
    return;
  }
  sessionStorage.setItem('relay_to', to);

  // ✅ 2. 取得 liffId
  let liffId = '';
  try {
    const r = await fetch('/api/liff');
    const j = await r.json();
    liffId = j.liffId || '';
  } catch (e) {}
  if (!liffId) {
    el.textContent = 'LIFF ID 無法取得，請確認 /api/liff 設定';
    return;
  }

  // ✅ 3. 載入 LIFF SDK
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });

  // ✅ 4. 初始化 LIFF
  try {
    await liff.init({ liffId });
  } catch (e) {
    el.textContent = 'LIFF 初始化失敗：' + (e?.message || e);
    return;
  }

  // ✅ 5. 未登入就要求登入（redirect 回來會保留 sessionStorage）
  if (!liff.isLoggedIn()) {
    el.textContent = '登入中…';
    liff.login({ redirectUri: location.href });
    return;
  }

  // ✅ 6. 取得使用者 ID
  let userId = '';
  try {
    const profile = await liff.getProfile();
    userId = profile.userId || '';
  } catch (e) {
    console.warn('取 userId 失敗', e);
  }

  // ✅ 7. 組合最終網址
  const target = new URL(decodeURIComponent(to));
  const q = target.searchParams;
  if (userId) q.set('userId', userId);

  // 保留 venuesid（若存在於原 query）
  const venuesid = currentParams.get('venuesid');
  if (venuesid) q.set('venuesid', venuesid);

  const finalUrl = target.toString();

  // ✅ 8. 判斷是否開外部瀏覽器
  const oeb = currentParams.get('openExternalBrowser');
  if (oeb === '1' && liff.isInClient()) {
    el.textContent = '開啟外部瀏覽器中…';
    liff.openWindow({ url: finalUrl, external: true });
  } else {
    el.textContent = '跳轉中…';
    location.replace(finalUrl);
  }
})();
</script>
</body>
</html>
