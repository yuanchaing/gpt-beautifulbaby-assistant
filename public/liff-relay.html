<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>正在開啟頁面…</title>
  <style>
    html,body{margin:0;padding:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","Helvetica Neue",Arial}
    .wrap{max-width:860px;margin:0 auto;padding:24px}
    .muted{color:#666;font-size:14px}
    .err{color:#b91c1c}
    .spinner{display:inline-block;width:1em;height:1em;border:.15em solid #ddd;border-top-color:#111;border-radius:50%;animation:spin .9s linear infinite;vertical-align:-.2em}
    @keyframes spin{to{transform:rotate(360deg)}}
    #debug{display:none;background:#0f172a;color:#cbd5e1;border-radius:8px;padding:12px;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap}
    code{background:#f1f5f9;padding:.1em .35em;border-radius:.35em}
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div class="wrap">
    <h2 id="title">正在開啟頁面… <span class="spinner"></span></h2>
    <p id="tip" class="muted">若未能成功開啟，請確認 LIFF 允許的網域與參數格式。</p>
    <pre id="debug"></pre>
  </div>

  <script>
    // 多層 URL 解碼（處理 %252F 這類）
    function multiDecode(s, times = 3) {
      if (!s) return s;
      let out = String(s);
      for (let i = 0; i < times; i++) {
        try {
          const dec = decodeURIComponent(out);
          if (dec === out) break;
          out = dec;
        } catch { break; }
      }
      return out;
    }
    function parseQS(qsLike) {
      if (!qsLike) return new URLSearchParams('');
      let qs = String(qsLike).trim();
      if (qs.startsWith('?') || qs.startsWith('#')) qs = qs.slice(1);
      return new URLSearchParams(qs);
    }
    function getParam(name){
      const usp = new URLSearchParams(location.search);
      return usp.get(name);
    }
    function findToParam() {
      const href = String(location.href);
      const usp = new URLSearchParams(location.search);

      // 1) 直接 ?to=
      let to = usp.get('to');

      // 2) liff.state 內含 to（可能多層編碼/巢狀）
      if (!to) {
        const ls = usp.get('liff.state');
        if (ls) {
          const s1 = multiDecode(ls);
          const p1 = parseQS(s1);
          to = p1.get('to');
          if (!to) {
            const ls2 = p1.get('liff.state');
            if (ls2) {
              const s2 = multiDecode(ls2);
              to = parseQS(s2).get('to');
            }
          }
        }
      }
      // 3) hash 兜底
      if (!to && location.hash) {
        to = parseQS(location.hash).get('to');
      }
      if (to) to = multiDecode(to);
      return { to, href, liffState: multiDecode(getParam('liff.state') || '') };
    }
    function safeHttpUrl(u) {
      try {
        const url = new URL(u);
        return /^(http|https):$/i.test(url.protocol);
      } catch { return false; }
    }

    (async () => {
      const showDebug = (getParam('debug') === '1');
      const info = findToParam();
      const debugPayload = {
        note: "debug payload (add ?debug=1 to show this)",
        to: info.to || null,
        raw: { href: info.href, liffState: info.liffState }
      };

      if (showDebug) {
        const pre = document.getElementById('debug');
        pre.style.display = 'block';
        pre.textContent = JSON.stringify(debugPayload, null, 2);
      }

      const titleEl = document.getElementById('title');
      const tipEl = document.getElementById('tip');

      if (!info.to) {
        titleEl.innerHTML = '開啟失敗';
        tipEl.innerHTML = '未帶到 <code>to</code> 參數，請確認 LIFF 入口 URL 是否包含 <code>?to=</code> 或 <code>liff.state</code> 內含 to。';
        if (showDebug === false) {
          // 若沒開 debug，就顯示最基本訊息
          const pre = document.getElementById('debug');
          pre.style.display = 'block';
          pre.textContent = JSON.stringify(debugPayload, null, 2);
        }
        return;
      }

      if (!safeHttpUrl(info.to)) {
        titleEl.innerHTML = '開啟失敗';
        tipEl.innerHTML = 'to 參數不是有效的 http(s) URL：<br><code>' + info.to + '</code>';
        return;
      }

      // 是否外開瀏覽器（可選）
      const openExternal = (getParam('openExternalBrowser') || '').toLowerCase() === 'true';
      try {
        if (openExternal && window.liff) {
          await liff.init({ liffId: "DUMMY" }).catch(()=>{});
          liff.openWindow({ url: info.to, external: true });
        } else {
          location.replace(info.to);
        }
      } catch (e) {
        titleEl.innerHTML = '開啟失敗';
        tipEl.innerHTML = '轉址時發生錯誤：<code>' + String(e) + '</code>';
      }
    })();
  </script>
</body>
</html>
